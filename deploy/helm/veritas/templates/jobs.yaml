{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "veritas.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Before every install and upgrade; forward-only and safe to re-run
    # (orchestrator/migrate.py). A failed migration fails the release.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "veritas.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      # A pre-install hook runs before the chart's ServiceAccount exists, so this
      # Job uses the namespace default; it mounts no token either way.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "veritas.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [python, scripts/migrate.py]
          {{- include "veritas.env" (dict "root" .) | nindent 10 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          {{- include "veritas.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "veritas.tmp" . | nindent 8 }}
{{- end }}
{{- if .Values.reconcile.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "veritas.fullname" . }}-reconcile
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconcile
spec:
  schedule: {{ .Values.reconcile.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "veritas.selector" (dict "root" . "component" "reconcile") | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- include "veritas.podSecurity" . | nindent 10 }}
          containers:
            - name: reconcile
              image: {{ include "veritas.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # Exit 2 when any check fails: a failed Job is the alert
              # (VeritasLedgerReconciliationFailed).
              args: [python, -m, bench.reconcile_ledger, --out, /tmp/ledger_reconciliation.json]
              {{- include "veritas.env" (dict "root" .) | nindent 14 }}
              resources:
                {{- toYaml .Values.reconcile.resources | nindent 16 }}
              {{- include "veritas.containerSecurity" . | nindent 14 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            {{- include "veritas.tmp" . | nindent 12 }}
{{- end }}
