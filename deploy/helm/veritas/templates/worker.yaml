{{- $c := dict "root" . "component" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veritas.fullname" . }}-worker
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "veritas.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "veritas.selector" $c | nindent 8 }}
    spec:
      {{- include "veritas.podSecurity" . | nindent 6 }}
      {{- include "veritas.spread" $c | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "veritas.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [python, -m, service.worker]
          {{- $extra := dict "WORKER_CONCURRENCY" .Values.worker.concurrency "WORKER_HEALTH_PORT" .Values.worker.healthPort "WORKER_HEALTH_HOST" "0.0.0.0" }}
          {{- include "veritas.env" (dict "root" . "extra" $extra) | nindent 10 }}
          ports:
            - {name: metrics, containerPort: {{ .Values.worker.healthPort }}}
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- include "veritas.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "veritas.tmp" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "veritas.fullname" . }}-worker-metrics
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    {{- include "veritas.selector" $c | nindent 4 }}
  ports:
    - {name: metrics, port: {{ .Values.worker.healthPort }}, targetPort: metrics}
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "veritas.fullname" . }}-worker
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "veritas.fullname" . }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.worker.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "veritas.fullname" . }}-worker
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "veritas.selector" $c | nindent 6 }}
{{- end }}
